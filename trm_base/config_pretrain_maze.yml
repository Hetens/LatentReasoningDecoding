# Pretrain config for Maze-Hard (30x30), attention variant.
#
# Differences from config_pretrain_paper.yml (Sudoku):
#   seq_len is 900 rather than 81, so attention cost rises ~123x per
#   sequence and activation memory ~11x. global_batch_size is cut from
#   768 to 64 to compensate; total_steps = epochs * total_groups(1000)
#   / batch, so epochs is set to keep the run inside a chainable budget.
#
# Checkpoints every eval_interval epochs; resume with load_checkpoint.

defaults:
  - arch: trm_paper
  - _self_

hydra:
  output_subdir: null

data_paths: ['data/maze-30x30-hard-1k']
data_paths_test: ['data/maze-30x30-hard-1k']

max_train_samples: null
max_test_samples: null

evaluators: []

# --- Hyperparams ---
# 64 * 900 tokens/step ~= 58k tokens, comparable to Sudoku's 768 * 81 ~= 62k,
# but attention is quadratic in seq_len so per-step cost is still higher.
global_batch_size: 64

epochs: 10000
eval_interval: 500        # must divide epochs; 20 checkpoints
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

puzzle_emb_lr: 1e-4

seed: 0
min_eval_interval: 0

ema: True
ema_rate: 0.999
freeze_weights: False
