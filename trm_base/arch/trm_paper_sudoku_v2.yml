# Architecture for Sudoku-Extreme (attention variant), matching upstream
# config/arch/trm.yaml exactly.
#
# Corrects the same three deviations that trm_paper_maze_v3.yml did, found by
# diffing against SamsungSAILMontreal/TinyRecursiveModels config/arch/trm.yaml:
#
#   puzzle_emb_ndim        0    -> 512   (upstream: ${.hidden_size})
#   puzzle_emb_len         0    -> 16
#   halt_exploration_prob  0.05 -> 0.1
#
# puzzle_emb_ndim/len restore 16 prefix slots that live inside z_H and z_L and
# persist across recursion steps. Our sudoku-extreme-1k-aug-1000 build has
# num_puzzle_identifiers=1, so these are task-global scratchpad registers, not
# per-puzzle memory. Sequence length becomes 81 + 16 = 97.
#
# L_cycles is 6 here, versus the maze arch's 4, because the upstream Sudoku
# command overrides it: arch.L_layers=2 arch.H_cycles=3 arch.L_cycles=6
#
# pos_encodings is rope: the upstream MLP variant overrides it to none, the
# attention variant (this one) does not override it at all.
#
# H_layers is left at upstream's 0 for honesty, but it is dead config: trm.py
# builds only self.L_level and reuses it for both z_H and z_L updates. The old
# trm_paper.yml had 2 here, which changed nothing.
name: trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

H_cycles: 3
L_cycles: 6
H_layers: 0
L_layers: 2
hidden_size: 512
expansion: 4.0
num_heads: 8
num_key_value_heads: 8
pos_encodings: rope

puzzle_emb_ndim: 512
puzzle_emb_len: 16

halt_max_steps: 16
halt_exploration_prob: 0.1

mlp_t: false
no_ACT_continue: true
forward_dtype: bfloat16
rms_norm_eps: 1.0e-5
rope_theta: 10000.0
