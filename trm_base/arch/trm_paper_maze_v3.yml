# Architecture for Maze-Hard, matching upstream config/arch/trm.yaml exactly.
#
# Corrects three deviations found on 2026-07-29 by diffing against
# SamsungSAILMontreal/TinyRecursiveModels config/arch/trm.yaml, after the v2
# run finished at 0.157 exact accuracy versus the paper's ~0.85:
#
#   puzzle_emb_ndim        0    -> 512   (upstream: ${.hidden_size})
#   puzzle_emb_len         0    -> 16
#   halt_exploration_prob  0.05 -> 0.1
#
# puzzle_emb_ndim/len restore 16 prefix slots that live inside z_H and z_L and
# persist across recursion steps. The maze dataset has num_puzzle_identifiers=1
# (build_maze_dataset.py hardcodes identifier 0), so these are task-global
# scratchpad registers, not per-puzzle memory. Sequence length becomes 916.
#
# L_cycles is 4, not upstream's default 6, because the maze command overrides
# it: arch.L_layers=2 arch.H_cycles=3 arch.L_cycles=4
#
# H_layers is left at upstream's 0 for honesty, but it is dead config: trm.py
# builds only self.L_level and reuses it for both z_H and z_L updates.
name: trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

H_cycles: 3
L_cycles: 4
H_layers: 0
L_layers: 2
hidden_size: 512
expansion: 4.0
num_heads: 8
num_key_value_heads: 8
pos_encodings: rope

puzzle_emb_ndim: 512
puzzle_emb_len: 16

halt_max_steps: 16
halt_exploration_prob: 0.1

mlp_t: false
no_ACT_continue: true
forward_dtype: bfloat16
rms_norm_eps: 1.0e-5
rope_theta: 10000.0
